[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm-rhythm"
version = "0.1.0"
description = "Atomic rhythm model and five-line Derbake processing"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "transformers==4.51.3",
  "safetensors>=0.4,<1",
]

[project.optional-dependencies]
audio = ["soundfile", "librosa"]
analysis = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["ldm*"]
